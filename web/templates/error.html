<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM BREACH - EpochAI</title>
    <!-- Google Fonts Outfit & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060708;
            --bg-vignette: rgba(239, 68, 68, 0.03); /* Extremely subtle deep red glow */
            --panel-bg: rgba(13, 14, 18, 0.85);
            --border-glow: rgba(239, 68, 68, 0.25);
            --border-color: rgba(255, 255, 255, 0.05);
            --accent-cyan: #00d2ff;
            --accent-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #83899a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 50%, var(--bg-vignette) 0%, transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.007) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.007) 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px, 24px 24px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Scanline effect to simulate terminal */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            opacity: 0.45;
        }

        .terminal-container {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-top: 2px solid var(--accent-red);
            border-radius: 4px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9), 0 0 40px rgba(239, 68, 68, 0.03);
            padding: 2.5rem;
            width: 100%;
            max-width: 520px;
            margin: 1.5rem;
            position: relative;
            z-index: 10;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1.75rem;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .terminal-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .terminal-dot.active {
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        .terminal-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--accent-red);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .error-glow-icon {
            font-size: 3rem;
            color: var(--accent-red);
            margin: 1rem 0 1.5rem 0;
            display: inline-block;
            animation: pulse-glow 2.5s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(239, 68, 68, 0.2)); opacity: 0.85; }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.6)); opacity: 1; }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(239, 68, 68, 0.2)); opacity: 0.85; }
        }

        .error-title {
            font-family: 'Fira Code', monospace;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
            color: #ffffff;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .error-message {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
            font-family: 'Fira Code', monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            text-align: left;
            word-break: break-word;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .terminal-btn {
            padding: 0.6rem 1.4rem;
            border: 1px solid var(--border-color);
            background: transparent;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 3px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .terminal-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .terminal-btn.btn-primary {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
        }

        .terminal-btn.btn-primary:hover {
            background: #d32f2f;
            border-color: #d32f2f;
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.3);
        }

        .terminal-footer {
            margin-top: 2.25rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="terminal-dots">
                <div class="terminal-dot active"></div>
                <div class="terminal-dot"></div>
                <div class="terminal-dot"></div>
            </div>
            <div class="terminal-tag">SIMULATION BREAKDOWN</div>
        </div>

        <div style="text-align: center;">
            <div class="error-glow-icon">
                <i class="fas fa-triangle-exclamation"></i>
            </div>
            <h1 class="error-title">
                <span style="color: var(--accent-red);">&gt;</span> CRITICAL_EXCEPTION
            </h1>
            
            <div class="error-message">
                {{ error or "An unexpected exception was encountered inside the core predictive simulation models. Please verify systems telemetry." }}
            </div>

            <div class="error-actions">
                <a href="/" class="terminal-btn btn-primary"><i class="fas fa-house-chimney"></i> REBOOT DASHBOARD</a>
                <a href="javascript:history.back()" class="terminal-btn"><i class="fas fa-terminal"></i> ABORT RUN</a>
            </div>

            <div class="terminal-footer">
                EPOCH AI CORE ENG SECURE SHELL
            </div>
        </div>
    </div>
</body>
</html>
