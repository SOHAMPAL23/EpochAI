<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelQ - Financial Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.19); }
        .metric-card { background: white; }
        .prediction-up { color: #28a745; }
        .prediction-down { color: #dc3545; }
        .btn-refresh { background: linear-gradient(45deg, #ff6b6b, #feca57); border: none; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-5">
                    <h1 class="text-white"><i class="fas fa-chart-line me-3"></i>ModelQ Dashboard</h1>
                    <p class="text-white-50">AI-Powered Financial Forecasting</p>
                </div>

                <div class="card metric-card mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h3>Prediction</h3>
                            <button id="refreshBtn" class="btn btn-refresh">
                                <i class="fas fa-sync-alt me-2"></i>Refresh
                            </button>
                        </div>
                        
                        <div class="row text-center mt-4">
                            <div class="col-md-3">
                                <div class="display-4 fw-bold" id="direction">--</div>
                                <small class="text-muted">Direction</small>
                            </div>
                            <div class="col-md-3">
                                <div class="display-5" id="return">--%</div>
                                <small class="text-muted">Expected Return</small>
                            </div>
                            <div class="col-md-3">
                                <div class="display-5" id="confidence">--%</div>
                                <small class="text-muted">Confidence</small>
                            </div>
                            <div class="col-md-3">
                                <div class="display-5" id="regime">--</div>
                                <small class="text-muted">Regime</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="card metric-card h-100">
                            <div class="card-body">
                                <h4><i class="fas fa-percentage me-2"></i>Quantiles</h4>
                                <div class="mt-3">
                                    <div class="d-flex justify-content-between">
                                        <span>P10:</span>
                                        <strong id="p10">--%</strong>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <span>P50:</span>
                                        <strong id="p50">--%</strong>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <span>P90:</span>
                                        <strong id="p90">--%</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card metric-card h-100">
                            <div class="card-body">
                                <h4><i class="fas fa-shield-alt me-2"></i>Risk Metrics</h4>
                                <div class="mt-3">
                                    <div class="d-flex justify-content-between">
                                        <span>VaR 95%:</span>
                                        <strong id="var95">--%</strong>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <span>Max Drawdown:</span>
                                        <strong id="drawdown">--%</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        This system uses synthetic data for demonstration only. Not for real trading.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadPrediction() {
            try {
                const response = await fetch('/api/predict');
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Update UI
                document.getElementById('direction').textContent = data.direction;
                document.getElementById('direction').className = 'display-4 fw-bold ' + 
                    (data.direction === 'UP' ? 'prediction-up' : 'prediction-down');
                
                document.getElementById('return').textContent = data.expected_return + '%';
                document.getElementById('confidence').textContent = (data.confidence * 100).toFixed(1) + '%';
                document.getElementById('regime').textContent = data.regime;
                document.getElementById('p10').textContent = data.quantiles.p10 + '%';
                document.getElementById('p50').textContent = data.quantiles.p50 + '%';
                document.getElementById('p90').textContent = data.quantiles.p90 + '%';
                document.getElementById('var95').textContent = data.risk_metrics.var95 + '%';
                document.getElementById('drawdown').textContent = data.risk_metrics.max_drawdown + '%';
                
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load prediction: ' + error.message);
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadPrediction);
        
        // Load initial data
        document.addEventListener('DOMContentLoaded', loadPrediction);
    </script>
</body>
</html>
